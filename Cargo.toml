[workspace]
resolver = "3"
members = [
    "crates/vz-anim",
    "crates/vz-core",
    "crates/vz-media",
    "crates/vz-render",
    "crates/vz-text",
    "crates/vz-vector",
    "crates/vz-audio",
    "crates/vz-export",
    "crates/vz-presets",
    "crates/vz-ui",
    "crates/vidzcut",
    "spikes/sinhala",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = "0.36"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "LicenseRef-Proprietary"

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
